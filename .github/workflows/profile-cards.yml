name: Update profile cards

on:
  push:
    branches:
      - main
  # Test run for Renovate (and any other) PRs: cards are generated but not published
  pull_request:
    paths:
      - ".github/workflows/profile-cards.yml"
  schedule:
    # Once a day is enough: the streak card only changes when the date does
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare output directory
        run: mkdir -p profile

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@125aaaf200620410446ebfa51897fca3607e04fd # v1.8.2
        with:
          options: user=${{ github.repository_owner }}&theme=dracula&date_format=[Y.]n.j&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=dracula&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=dracula&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Check cards were generated
        run: |
          for f in profile/streak.svg profile/stats.svg profile/top-langs.svg; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
            grep -q "<svg" "$f" || { echo "::error::$f is not an SVG"; exit 1; }
          done

      # Cards live on a separate "output" branch (single commit, force-pushed)
      # so they never add commits to main's history.
      - name: Publish cards to output branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git fetch --quiet --depth=1 origin output 2>/dev/null; then
            changed=false
            for f in streak stats top-langs; do
              git show "FETCH_HEAD:$f.svg" 2>/dev/null | cmp -s - "profile/$f.svg" || changed=true
            done
            if [ "$changed" = false ]; then
              echo "No card changes, skipping push"
              exit 0
            fi
          fi
          cd profile
          git init --quiet -b output
          git add *.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "chore: update profile cards"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
